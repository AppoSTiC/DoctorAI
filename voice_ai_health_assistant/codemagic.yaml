workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate Android Folder
        script: |
          flutter create --platforms=android .
      - name: Fix SDK and Permissions
        script: |
          sed -i.bak 's/flutter.minSdkVersion/21/g' android/app/build.gradle
          sed -i.bak '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n' android/app/src/main/AndroidManifest.xml
      - name: Install Dependencies
        script: |
          flutter packages pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
